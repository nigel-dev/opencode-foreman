# Releases with release-please. A push to main opens or updates a release PR that bumps
# package.json, .release-please-manifest.json, and CHANGELOG.md. Nothing is published until that
# PR is merged: then release-please tags the commit, creates the GitHub release, and the publish
# job below publishes to npm.
#
# npm trusted publishing (OIDC) is bound to this file name, so the publish job must stay in
# publish.yml.
name: Publish to npm

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - name: Release Please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          # A PR or tag created with GITHUB_TOKEN does not trigger other workflows, so CI does not
          # run on the release PR. Add a RELEASE_PLEASE_TOKEN secret (a fine-grained token with
          # contents and pull-requests write on this repository) to have CI run on it.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.release-please.outputs.sha }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      # Trusted publishing needs npm 11.5.1 or later.
      - name: Update npm
        run: npm install -g npm@11 && npm --version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Install the packed package
        run: bun run check:pack

      - name: Test
        shell: bash
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          for file in tests/**/*.test.ts; do
            bun test "$file"
          done

      - name: Publish
        run: npm publish
